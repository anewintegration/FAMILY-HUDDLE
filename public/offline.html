<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huddle - reconnecting</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; text-align: center; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #0A2540 0%, #0D3B4F 45%, #0F5C5A 100%);
    }
    .box { padding: 24px; max-width: 520px; }
    h1 { font-size: 30px; margin: 0 0 10px; }
    p { font-size: 18px; line-height: 1.45; margin: 0 0 22px; opacity: .92; }
    button {
      font: inherit; font-weight: 700; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px;
      background: #fff; color: #1B2340;
    }
    .dot { display: inline-block; width: 12px; height: 12px; margin-right: 10px; border-radius: 50%; background: #FFB238; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="box" role="status">
    <h1><span class="dot"></span>Reconnecting to Huddle…</h1>
    <p>The Wi-Fi or the server isn't answering right now. This screen will come back by itself.</p>
    <button id="retry" type="button">Try now</button>
  </div>
  <script>
    (function () {
      var busy = false;
      function check() {
        if (busy) return;
        busy = true;
        var controller = new AbortController();
        var giveUp = setTimeout(function () { controller.abort(); }, 8000);
        fetch('/api/health', { cache: 'no-store', signal: controller.signal })
          .then(function (res) { if (res.status < 500) location.reload(); })
          .catch(function () {})
          .then(function () { clearTimeout(giveUp); busy = false; });
      }
      document.getElementById('retry').addEventListener('click', check);
      window.addEventListener('online', check);
      setInterval(check, 5000);
    })();
  </script>
</body>
</html>
